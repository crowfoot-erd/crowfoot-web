<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="eMAByOhYVp1V8U1FFoUPH9pRwntSPyPkGVTol2Sdosk" />
    <title>Crowfoot — ERD Editor</title>
    <script>
      // 테마 FOUC 방지 — 본문 렌더 전에 localStorage 테마 적용 (04-front/storyboard/00-common.md §3.9)
      ;(function () {
        try {
          var stored = localStorage.getItem('crowfoot.theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 접근 불가 시 라이트 기본 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
