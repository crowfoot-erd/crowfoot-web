<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 로고(public/logo.svg — .github/profile/logo.svg) 기반 파비콘:
       '0 또는 1' 환(○) — 관계선 — '다수' 까마귀발. 512 → 64 축척(1/8)에
       선은 4.25 → 5로 굵게 — 16px 렌더에서도 관계선이 지워지지 않게 -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <g stroke="#fafafa" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="15.5" cy="32" r="6"/>
    <line x1="24.6" y1="32" x2="41.9" y2="32"/>
    <line x1="41.9" y1="32" x2="54.4" y2="17.75"/>
    <line x1="41.9" y1="32" x2="54.4" y2="32"/>
    <line x1="41.9" y1="32" x2="54.4" y2="46.25"/>
  </g>
</svg>
