# SPA 라우팅 — react-router의 모든 경로를 index.html로 (직접 접근·새로고침 대응)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시 파일명 에셋은 1년 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
