# SPA 라우팅 — react-router의 모든 경로를 index.html로 (직접 접근·새로고침 대응)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS를 앞단 프록시가 종단해 nginx 입장에선 평문 http — 디렉터리 슬래시 보정 301이
    # http 절대 URL로 새면 80포트(기본 페이지)로 빠져버린다. 절대 URL 생성을 끔(안전장치).
    absolute_redirect off;

    location / {
        # $uri/ (디렉터리 매칭)를 쓰지 않는다 — 프리렌더 산출 /en·/terms 등 디렉터리에 대해
        # 301 슬래시 보정 없이 index.html을 바로 서빙해야 sitemap·canonical(슬래시 없는 형태)과 일치.
        try_files $uri $uri/index.html /index.html;
    }

    # 해시 파일명 에셋은 1년 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
