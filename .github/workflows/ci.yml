---
name: CI - Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/crowfoot-web
  APP_NAME: crowfoot-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (vite — .env.production 적용)
        run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update manifest repo
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/crowfoot-erd/crowfoot-manifests.git
          cd crowfoot-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 여러 리포 CI가 동시에 이 리포에 push — 거부(non-fast-forward)되면 rebase 후 재시도
          for i in 1 2 3 4 5; do
            sed -i "s|image: ghcr.io/crowfoot-erd/${APP_NAME}:.*|image: ghcr.io/crowfoot-erd/${APP_NAME}:${{ github.sha }}|" apps/${APP_NAME}/deployment.yaml
            git add apps/${APP_NAME}/deployment.yaml
            git commit -m "chore: update ${APP_NAME} image to ${{ github.sha }}" || echo "No changes to commit"
            if git push; then exit 0; fi
            echo "::warning::manifest push rejected (concurrent update) — retry $i/5"
            git pull --rebase
          done
          echo "manifest repo update failed after 5 attempts" >&2
          exit 1
